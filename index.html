<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saudi AI</title>
    <style>
        /* تهيئة عامة للشاشة */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: radial-gradient(circle at center, #0f1c14 0%, #080d0a 100%); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #ffffff; 
            margin: 0; 
            min-height: 100vh; 
            height: 100%;
            overflow-x: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            position: relative;
        }
        
        /* الحاوية الرئيسية للتطبيق - متجاوبة 100% */
        .app-wrapper { 
            display: flex; 
            width: 100%; 
            height: 100%; 
            max-width: 950px; 
            max-height: 800px;
            background: rgba(18, 26, 21, 0.90); 
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0, 168, 89, 0.3); 
            border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7); 
            overflow: hidden; 
            position: relative; 
            z-index: 1;
        }

        /* تنسيق خاص للأجهزة اللوحية والموبايل */
        @media (max-width: 768px) {
            body { height: 100vh; overflow: hidden; }
            .app-wrapper { 
                max-width: 100%; 
                max-height: 100%; 
                border-radius: 0; 
                border: none; 
            }
            .sidebar { 
                position: absolute !important; 
                right: -280px; 
                top: 0; 
                height: 100%; 
                z-index: 100; 
                transition: right 0.3s ease-in-out; 
                box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            }
            .sidebar.open { right: 0; }
            .header h1 { font-size: 1.2rem; }
            .message-container { max-width: 92%; }
            .msg-actions { font-size: 0.7rem; }
        }

        /* شاشة تسجيل الدخول */
        #loginOverlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #0d1611; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 200; 
            padding: 20px; text-align: center; 
        }
        #loginOverlay h2 { color: #00ff88; margin-bottom: 15px; font-size: 2rem; text-shadow: 0 0 15px rgba(0,255,136,0.5); }
        #loginOverlay p { color: #8fa396; font-size: 1rem; margin-bottom: 30px; }
        #usernameInput { 
            width: 90%; max-width: 350px; background: rgba(26, 38, 30, 0.95); 
            border: 2px solid rgba(0, 168, 89, 0.6); color: #ffffff; 
            padding: 15px 20px; border-radius: 15px; outline: none; font-size: 1.1rem; 
            margin-bottom: 25px; text-align: center; 
        }
        #usernameInput:focus { border-color: #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.3); }
        #loginBtn { 
            background: linear-gradient(135deg, #00b359, #006c35); color: #ffffff; 
            border: none; padding: 15px 40px; border-radius: 15px; cursor: pointer; 
            font-weight: bold; font-size: 1.2rem; transition: 0.3s; text-transform: uppercase; 
        }
        #loginBtn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,179,89,0.5); }

        /* القائمة الجانبية - متجاوبة */
        .sidebar { 
            width: 280px; background: rgba(10, 17, 13, 0.98); 
            border-left: 1px solid rgba(0, 168, 89, 0.2); display: flex; 
            flex-direction: column; padding: 20px; 
        }
        .new-chat-btn { 
            background: linear-gradient(135deg, #00a859, #004d25); color: white; 
            border: none; padding: 15px; border-radius: 12px; cursor: pointer; 
            font-weight: bold; font-size: 1rem; margin-bottom: 20px; 
            text-align: center; transition: 0.2s; 
        }
        .new-chat-btn:hover { opacity: 0.9; transform: scale(1.02); }
        .sessions-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .sessions-list::-webkit-scrollbar { width: 6px; }
        .sessions-list::-webkit-scrollbar-thumb { background: #006c35; border-radius: 3px; }
        
        .session-item { 
            padding: 15px; background: rgba(22, 33, 26, 0.6); border-radius: 10px; 
            font-size: 0.95rem; cursor: pointer; color: #b8c7be; 
            display: flex; justify-content: space-between; align-items: center; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
            transition: background 0.2s; 
        }
        .session-item:hover { background: rgba(30, 48, 36, 0.9); color: white; }
        .session-item.active { background: linear-gradient(135deg, #006c35, #004d25); color: white; font-weight: bold; }
        .session-delete { background: none; border: none; color: #ff6b6b; cursor: pointer; font-size: 1.1rem; padding: 5px; }
        .session-delete:hover { color: #ff9999; transform: scale(1.1); }

        /* واجهة المحادثة الرئيسية */
        .container { flex: 1; height: 100%; background: transparent; display: flex; flex-direction: column; position: relative; min-width: 0; }
        
        /* الهيدر - متجاوب */
        .header { 
            background: linear-gradient(135deg, #005c2d, #022b16); padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid rgba(0, 168, 89, 0.4); box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
            flex-shrink: 0; min-height: 60px;
        }
        .header h1 { font-size: 1.4rem; margin: 0; color: #ffffff; font-weight: bold; }
        .header-btns { display: flex; gap: 10px; align-items: center; }
        .action-btn { 
            background: rgba(0, 82, 39, 0.8); border: 1px solid rgba(0, 168, 89, 0.6); 
            color: white; padding: 8px 15px; border-radius: 10px; cursor: pointer; 
            font-size: 0.9rem; font-weight: bold; transition: 0.2s; display: flex; align-items: center; gap: 5px;
        }
        .action-btn:hover { background: #006c35; border-color: #00ff88; transform: translateY(-1px); }
        .menu-toggle { display: none; }
        @media (max-width: 768px) { .menu-toggle { display: flex; } }

        /* الشات - متجاوب */
        .chat-box { 
            flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; 
            gap: 20px; scroll-behavior: smooth; 
        }
        .chat-box::-webkit-scrollbar { width: 8px; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(0,108,53,0.7); border-radius: 4px; }
        
        .message-container { display: flex; flex-direction: column; max-width: 85%; margin-bottom: 10px; }
        .message-container.user { align-self: flex-end; }
        .message-container.ai { align-self: flex-start; }
        
        .message { 
            padding: 15px 20px; border-radius: 18px; font-size: 1.1rem; 
            line-height: 1.6; word-wrap: break-word; white-space: pre-wrap; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
        }
        .message.user { 
            background: linear-gradient(135deg, #007a3d, #005228); 
            color: #ffffff; border-bottom-right-radius: 5px; 
            border: 1px solid rgba(0,255,136,0.2); 
        }
        .message.ai { 
            background: rgba(26, 38, 30, 0.95); color: #e2ede8; 
            border-bottom-left-radius: 5px; border-left: 4px solid #00ff88; 
            border: 1px solid rgba(0,168,89,0.3); 
        }
        .ai-image { 
            width: 100%; max-width: 300px; border-radius: 15px; 
            margin-top: 15px; border: 3px solid rgba(0,255,136,0.5); 
            display: block; box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
        }
        .msg-actions { display: flex; gap: 15px; margin-top: 8px; font-size: 0.9rem; padding: 0 10px; }
        .msg-actions button { 
            background: none; border: none; color: #7a9485; cursor: pointer; 
            padding: 0; transition: 0.2s; font-weight: 600; 
        }
        .msg-actions button:hover { color: #00ff88; text-decoration: underline; }

        /* مؤشر الكتابة */
        .typing-indicator { padding: 15px 20px; background: rgba(26, 38, 30, 0.95); border-radius: 18px; width: fit-content; border-bottom-left-radius: 5px; border-left: 4px solid #00ff88; }
        .typing-indicator span { height: 10px; width: 10px; float: left; margin: 0 3px; background-color: #00ff88; border-radius: 50%; display: inline-block; animation: bounce 1.3s infinite ease-in-out; opacity: 0.7; }
        .typing-indicator span:nth-child(2) { animation-delay: -1.1s; }
        .typing-indicator span:nth-child(3) { animation-delay: -0.9s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-7px); } }

        /* منطقة الإدخال - متجاوبة ومناسبة للمس */
        .input-area { 
            padding: 15px 20px; background: rgba(10, 17, 13, 0.95); 
            display: flex; gap: 12px; align-items: center; border-top: 1px solid rgba(0, 168, 89, 0.3); 
            flex-shrink: 0; min-height: 70px;
        }
        #userInput { 
            flex: 1; background: rgba(22, 33, 26, 0.95); 
            border: 1px solid rgba(0, 168, 89, 0.5); color: #ffffff; 
            padding: 15px 18px; border-radius: 15px; outline: none; 
            font-size: 1.1rem; transition: 0.3s; min-width: 0; 
            -webkit-appearance: none; /* تحسين شكل الحقل في الآيفون */
        }
        #userInput:focus { border-color: #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.2); }
        #sendBtn { 
            background: linear-gradient(135deg, #00a859, #004d25); color: #ffffff; 
            border: none; padding: 15px 25px; border-radius: 15px; cursor: pointer; 
            font-weight: bold; font-size: 1.1rem; transition: 0.2s; 
            box-shadow: 0 4px 10px rgba(0,108,53,0.3); 
            min-width: 80px;
        }
        #sendBtn:hover { transform: translateY(-2px); opacity: 0.95; }
        #sendBtn:disabled { background: #1c2620; color: #4e6356; cursor: not-allowed; box-shadow: none; }
    </style>
