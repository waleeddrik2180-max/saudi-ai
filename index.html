<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saudi AI</title>
    <style>
        body { background: #080d0a; font-family: Tahoma, sans-serif; color: #ffffff; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .app-wrapper { width: 100%; max-width: 500px; height: 90vh; background: #1a2620; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #006c35; }
        .header { padding: 15px; background: #004d25; text-align: center; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 10px; font-size: 14px; max-width: 80%; }
        .user { background: #007a3d; align-self: flex-end; }
        .ai { background: #263830; align-self: flex-start; }
        .actions { display: flex; gap: 5px; font-size: 10px; margin-bottom: 10px; }
        .btn-small { background: #006c35; color: white; border: none; padding: 2px 8px; border-radius: 5px; cursor: pointer; }
        .input-area { padding: 10px; display: flex; gap: 5px; background: #1a2620; }
        input { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #006c35; background: #0d1611; color: white; }
        button#sendBtn { background: #00ff88; color: black; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="header">
        <span>Saudi AI 🇸🇦</span>
        <button onclick="clearChat()" class="btn-small">مسح الكل</button>
    </div>
    <div id="chatBox" class="chat-box"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="اكتب رسالتك..." />
        <button id="sendBtn" onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    // تم وضع المفتاح الخاص بك هنا
    const API_KEY = "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";
    let chat = JSON.parse(localStorage.getItem('chat')) || [];

    function render() {
        const box = document.getElementById('chatBox');
        box.innerHTML = '';
        chat.forEach((msg, index) => {
            const div = document.createElement('div');
            div.className = `message ${msg.role}`;
            div.innerText = msg.content;
            
            const actions = document.createElement('div');
            actions.className = 'actions';
            
            if(msg.role === 'user') {
                actions.innerHTML = `<button class="btn-small" onclick="deleteMsg(${index})">حذف الرسالة</button>`;
            } else {
                actions.innerHTML = `<button class="btn-small" onclick="copyMsg('${msg.content.replace(/'/g, "\\'")}')">نسخ</button>`;
            }
            
            box.appendChild(div);
            box.appendChild(actions);
        });
        box.scrollTop = box.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        if(!input.value) return;
        
        chat.push({role: 'user', content: input.value});
        render();
        
        const val = input.value;
        input.value = '';

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {"Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json"},
                body: JSON.stringify({model: "llama-3.3-70b-versatile", messages: [{role: "user", content: val}]})
            });
            const data = await res.json();
            if(data.choices) {
                chat.push({role: 'ai', content: data.choices[0].message.content});
                localStorage.setItem('chat', JSON.stringify(chat));
                render();
            }
        } catch(e) { alert("حدث خطأ، تأكد من اتصالك!"); }
    }

    function clearChat() { chat = []; localStorage.removeItem('chat'); render(); }
    function deleteMsg(i) { chat.splice(i, 2); localStorage.setItem('chat', JSON.stringify(chat)); render(); }
    function copyMsg(text) { navigator.clipboard.writeText(text); alert("تم النسخ!"); }
    
    render();
</script>
</body>
</html>
