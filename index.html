<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saudi AI</title>
    <style>
        body { 
            background: radial-gradient(circle at center, #0f1c14 0%, #080d0a 100%); 
            font-family: Tahoma, sans-serif; 
            color: #ffffff; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            overscroll-behavior: none;
        }
        
        .app-wrapper { 
            display: flex; 
            width: 100%; 
            height: 100vh; 
            background: rgba(18, 26, 21, 0.95); 
            overflow: hidden; 
            position: relative; 
        }

        /* Login Overlay */
        #loginOverlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #0d1611; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 9999; padding: 20px; 
            text-align: center; box-sizing: border-box;
        }
        #loginOverlay h2 { color: #00ff88; margin-bottom: 15px; font-size: 24px; text-shadow: 0 0 10px rgba(0,255,136,0.4); }
        #loginOverlay p { color: #8fa396; font-size: 14px; margin-bottom: 25px; }
        #usernameInput { 
            width: 90%; max-width: 300px; background: rgba(26, 38, 30, 0.95); 
            border: 2px solid rgba(0, 168, 89, 0.6); color: #ffffff; padding: 12px; 
            border-radius: 10px; outline: none; font-size: 14px; margin-bottom: 20px; 
            text-align: center; box-sizing: border-box;
        }
        #loginBtn { 
            background: linear-gradient(135deg, #00b359, #006c35); color: #ffffff; 
            border: none; padding: 12px 30px; border-radius: 10px; cursor: pointer; 
            font-weight: bold; font-size: 14px;
        }

        /* Sidebar */
        .sidebar { 
            width: 250px; background: #0a110d; 
            border-left: 1px solid rgba(0, 168, 89, 0.2); 
            display: flex; flex-direction: column; padding: 10px; 
            box-sizing: border-box; position: absolute; right: -250px; 
            top: 0; height: 100%; z-index: 1000; transition: right 0.3s ease-in-out;
        }
        .sidebar.open { right: 0; }
        .new-chat-btn { 
            background: linear-gradient(135deg, #00a859, #004d25); color: white; 
            border: none; padding: 10px; border-radius: 8px; cursor: pointer; 
            font-weight: bold; font-size: 13px; margin-bottom: 10px; 
        }
        .sessions-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .sessions-list::-webkit-scrollbar { width: 3px; }
        .sessions-list::-webkit-scrollbar-thumb { background: #006c35; border-radius: 3px; }
        
        .session-item { 
            padding: 8px 10px; background: rgba(22, 33, 26, 0.6); border-radius: 6px; 
            font-size: 12px; cursor: pointer; color: #b8c7be; display: flex; 
            justify-content: space-between; align-items: center; white-space: nowrap; 
            overflow: hidden; text-overflow: ellipsis;
        }
        .session-item:hover { background: rgba(30, 48, 36, 0.8); color: white; }
        .session-item.active { background: linear-gradient(135deg, #006c35, #004d25); color: white; font-weight: bold; }
        .session-delete { background: none; border: none; color: #ff6b6b; cursor: pointer; font-size: 12px; padding: 0 4px; }

        /* Container */
        .container { flex: 1; height: 100%; background: transparent; display: flex; flex-direction: column; position: relative; }
        
        /* Header */
        .header { 
            background: #0d1611; padding: 8px 10px; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 1px solid rgba(0, 168, 89, 0.3); position: sticky; top: 0; z-index: 10;
        }
        .header h1 { font-size: 15px; margin: 0; color: #ffffff; font-weight: bold; }
        .header-btns { display: flex; gap: 4px; align-items: center; }
        .action-btn { 
            background: rgba(0, 82, 39, 0.6); border: 1px solid rgba(0, 168, 89, 0.6); 
            color: white; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; 
        }

        /* Chat Box */
        .chat-box { 
            flex: 1; padding: 15px; overflow-y: auto; display: flex; 
            flex-direction: column; gap: 12px; padding-bottom: 70px;
        }
        
        .message-container { display: flex; flex-direction: column; max-width: 85%; }
        .message-container.user { align-self: flex-end; }
        .message-container.ai { align-self: flex-start; }
        
        .message { 
            padding: 10px 14px; border-radius: 10px; font-size: 13px; 
            line-height: 1.4; word-wrap: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
        }
        .message.user { background: #006c35; color: #ffffff; border-bottom-right-radius: 3px; }
        .message.ai { background: #1a261e; color: #e2ede8; border-bottom-left-radius: 3px; border: 1px solid #00a859; }

        .ai-image { width: 100%; max-width: 250px; border-radius: 8px; margin-top: 8px; border: 1px solid #00a859; display: block; }

        .msg-actions { display: flex; gap: 8px; margin-top: 3px; font-size: 10px; padding: 0 2px; }
        .msg-actions button { background: none; border: none; color: #7a9485; cursor: pointer; padding: 0; }

        /* Input Area */
        .input-area { 
            padding: 10px; background: #0a110d; display: flex; gap: 8px; 
            border-top: 1px solid rgba(0, 168, 89, 0.3); 
            position: fixed; bottom: 0; left: 0; width: 100%; box-sizing: border-box; z-index: 20;
        }
        #userInput { 
            flex: 1; background: #080d0a; border: 1px solid #00a859; 
            color: #ffffff; padding: 12px; border-radius: 8px; outline: none; font-size: 14px; 
            -webkit-appearance: none;
        }
        #sendBtn { 
            background: linear-gradient(135deg, #00a859, #004d25); color: #ffffff; 
            border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; 
            font-weight: bold; font-size: 14px; transition: 0.2s;
        }
        #sendBtn:hover { opacity: 0.9; }
        #sendBtn:disabled { background: #1c2620; color: #4e6356; cursor: not-allowed; }

        /* Typing Indicator */
        .typing-indicator span { height: 7px; width: 7px; float: left; margin: 0 2px; background-color: #00ff88; border-radius: 50%; display: inline-block; animation: bounce 1.3s infinite ease-in-out; opacity: 0.7; }
        .typing-indicator span:nth-child(2) { animation-delay: -1.1s; }
        .typing-indicator span:nth-child(3) { animation-delay: -0.9s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

        /* Desktop Styles */
        @media (min-width: 768px) {
            .app-wrapper { width: 780px; height: 680px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
            .sidebar { position: relative; right: 0; }
            #mobileMenuBtn { display: none; }
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <!-- Login Overlay -->
    <div id="loginOverlay">
        <h2>Saudi AI 🇸🇦</h2>
        <p>الرجاء إدخال اسمك للبدء</p>
        <input type="text" id="usernameInput" placeholder="اكتب اسمك هنا..." />
        <button id="loginBtn" onclick="handleLogin()">دخول</button>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <button class="new-chat-btn" onclick="createNewChat()">+ محادثة جديدة</button>
        <div class="sessions-list" id="sessionsList"></div>
    </div>

    <!-- Main Container -->
    <div class="container" id="appContainer">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 5px;">
                <button class="action-btn" id="mobileMenuBtn" onclick="toggleSidebar()">☰</button>
                <button class="action-btn" onclick="clearCurrentChat()">🗑️ مسح</button>
            </div>
            <h1 id="mainTitle">Saudi AI 🇸🇦</h1>
            <button class="action-btn" onclick="handleLogout()">خروج</button>
        </div>
        
        <div id="chatBox" class="chat-box"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="اسأل أو ارسم مع سعودي AI..." inputmode="text" />
            <button id="sendBtn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>
</div>
