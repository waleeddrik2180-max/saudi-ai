<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>طريق الدوام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lalezar&display=swap">
<style>
:root{--asphalt:#1c2024;--asphalt-2:#272c31;--sign:#0b6e4f;--sign-deep:#08543c;--sign-ink:#fff;--plate:#ffc72c;--plate-ink:#1a1a14;--paper:#eef2ef;--muted:#a9b6b0;--danger:#e5484d;--danger-deep:#9c2a2e;--display:'Lalezar','IBM Plex Sans Arabic',system-ui,sans-serif;--body:'IBM Plex Sans Arabic',system-ui,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--asphalt);color:var(--sign-ink);font:500 15px/1.5 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
#app{height:100%;max-width:1000px;margin-inline:auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--asphalt)}
.hud{padding:10px 16px 8px;display:grid;gap:8px}
.row1{display:flex;align-items:center;gap:10px}
.sign{background:var(--sign);border:2px solid var(--sign-ink);border-radius:8px;box-shadow:0 0 0 2px var(--sign);padding:2px 12px;display:flex;align-items:baseline;gap:6px}
.bal{min-width:0}.bal .lbl{font-size:12px;opacity:.85}
.bal b{font:400 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.bal .unit{font:400 18px var(--display)}
.plate{margin-inline-start:auto;background:var(--plate);color:var(--plate-ink);border-radius:6px;padding:2px 12px;font:700 20px/1.3 var(--body);font-variant-numeric:tabular-nums;border:2px solid #1a1a14}
.plate.late{background:var(--danger);color:#fff}
.day{font-size:13px;color:var(--muted);white-space:nowrap}.day b{color:var(--sign-ink);font-size:16px}
.iconbtn{width:38px;height:38px;border-radius:8px;border:2px solid #3a4148;background:var(--asphalt-2);display:grid;place-items:center;padding:0}
.iconbtn svg{width:18px;height:18px;fill:var(--sign-ink)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:center}
.track{display:flex;align-items:center;gap:8px;min-width:0}.track svg{width:22px;height:22px;flex:none}
.rail{position:relative;flex:1;height:8px;background:#3a4148;border-radius:4px}
.rail i{position:absolute;inset:0 auto 0 0;width:0;background:var(--plate);border-radius:4px}
.rail u{position:absolute;top:50%;left:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;border:3px solid var(--sign);text-decoration:none}
.left{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.stam{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px;color:var(--muted)}
.bar{flex:1;height:10px;background:#3a4148;border-radius:5px;overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;width:100%;background:#5ed38a;transition:background .2s}
.stam.tired .bar i{background:var(--danger)}
.stam em{font-style:normal;color:var(--sign-ink);white-space:nowrap}
.hearts{color:var(--danger);font-size:15px;letter-spacing:1px;white-space:nowrap}
.hearts[hidden]{display:none}
#stage{position:relative;min-height:0;background:#7eb6d6;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sheet{position:absolute;inset:0;overflow-y:auto;padding:16px;background:var(--asphalt);display:flex;flex-direction:column;gap:16px}
.sheet[hidden]{display:none}
.sheet h2{margin:0;font:400 26px/1.2 var(--display);text-wrap:balance}
.mission{display:grid;gap:4px;color:var(--muted);font-size:14px}.mission b{color:var(--sign-ink);font-variant-numeric:tabular-nums}
.how{background:var(--asphalt-2);border:2px dashed var(--plate);border-radius:10px;padding:12px 14px;display:grid;gap:4px;font-size:14px}.how b{color:var(--plate)}
.merchant{display:flex;gap:12px;align-items:center}.merchant svg{width:64px;height:64px;flex:none}
.say{background:var(--paper);color:#17201b;border-radius:12px 12px 12px 2px;padding:10px 14px;font-size:14px}
.shopgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.shopgrid h3{grid-column:1/-1;margin:6px 0 0;font:400 20px var(--display);color:var(--plate)}
.item{background:var(--sign);border:3px solid var(--sign-ink);border-radius:10px;outline:2px solid var(--sign);padding:10px 12px;display:grid;gap:6px;min-width:0}
.item .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.item b{font:400 20px/1.2 var(--display)}
.item p{margin:0;font-size:13px;opacity:.92}
.item.car.cur{outline-color:var(--plate)}
.item .sw{height:8px;border-radius:4px;border:1px solid rgba(255,255,255,.5)}
.perk{font-size:11px;font-weight:700;background:var(--plate);color:var(--plate-ink);border-radius:99px;padding:1px 10px;white-space:nowrap}
.pips{display:flex;gap:4px}
.pips i{width:12px;height:12px;border-radius:50%;border:2px solid var(--sign-ink)}
.pips i.on{background:var(--plate);border-color:var(--plate)}
.buy{align-self:end;justify-self:start;background:var(--plate);color:var(--plate-ink);border:2px solid #1a1a14;border-radius:6px;padding:4px 14px;font:700 15px var(--body);font-variant-numeric:tabular-nums}
.buy:disabled{background:#6f7a74;color:#20262a;border-color:#20262a;cursor:not-allowed}
.buy.use{background:var(--paper)}
.buy.on{background:transparent;color:var(--sign-ink);border-color:var(--sign-ink);cursor:default}
.reset{align-self:flex-start;background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:13px}
.routes{display:grid;gap:10px}.routes h3{margin:0;font:400 20px var(--display);color:var(--plate)}
.routegrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.route{text-align:start;display:grid;gap:6px;min-width:0;background:var(--asphalt-2);border:3px solid #3a4148;border-radius:12px;padding:12px 14px;color:var(--sign-ink)}
.route .rt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.route .rt b{font:400 22px/1.2 var(--display)}
.route .tag{font-size:12px;font-weight:700;padding:1px 10px;border-radius:99px;border:2px solid currentColor}
.route.safe .tag{color:#5ed38a}.route.risk .tag{color:#ff8a3d}
.route p{margin:0;font-size:13px;color:var(--muted)}
.route ul{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-size:13px}
.route li b{font-variant-numeric:tabular-nums}
.route[aria-pressed="true"]{background:var(--sign);border-color:var(--plate);box-shadow:0 0 0 2px var(--sign)}
.route[aria-pressed="true"] p{color:#e3efe9}
.route.risk[aria-pressed="true"]{background:#7a3a14;box-shadow:0 0 0 2px #7a3a14}
.route.risk[aria-pressed="true"] p{color:#ffe8d6}
.mpbox{display:grid;gap:10px;background:var(--asphalt-2);border:3px solid #3a4148;border-radius:12px;padding:12px 14px}
.mpbox h3{margin:0;font:400 20px var(--display);color:var(--plate)}
.mpbox p{margin:0;font-size:14px}
.mprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mpin{background:var(--asphalt);color:var(--sign-ink);border:2px solid #3a4148;border-radius:6px;padding:6px 10px;font:500 15px var(--body);min-width:0;flex:1}
.mpcode{font:400 28px var(--display);color:var(--plate);letter-spacing:.1em}
.mperr{color:#ff8a8d;font-size:13px}
.chres{font:400 20px var(--display);text-align:center;border-top:2px solid rgba(255,255,255,.5);padding-top:8px}
.endcard{margin:auto;width:min(420px,100%);background:var(--sign);border:3px solid var(--sign-ink);outline:2px solid var(--sign);border-radius:12px;padding:18px;display:grid;gap:10px}
.endcard.bad{background:#8d2a2e;outline-color:#8d2a2e}
.endcard h2{font-size:30px}
.endcard .ln{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.endcard .tot{border-top:2px solid rgba(255,255,255,.5);padding-top:8px;font:400 24px var(--display)}
#pause{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,24,28,.62);font:400 34px var(--display)}
#pause[hidden]{display:none}
.ctl{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;justify-items:center;background:var(--asphalt)}
#go{width:min(100%,460px);height:64px;border-radius:14px;border:3px solid #1a1a14;background:var(--plate);color:var(--plate-ink);font:400 28px var(--display);touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:0 5px 0 #b88d00;transition:transform .05s,box-shadow .05s,background .15s}
#go:active{transform:translateY(4px);box-shadow:0 1px 0 #b88d00}
#go.idle{background:var(--sign);color:#fff;border-color:#fff;box-shadow:0 5px 0 var(--sign-deep)}
#go.idle:active{box-shadow:0 1px 0 var(--sign-deep)}
#go.run{background:var(--danger);color:#fff;border-color:#fff;box-shadow:0 5px 0 var(--danger-deep)}
#go.run:active{box-shadow:0 1px 0 var(--danger-deep)}
.keys{font-size:12px;color:var(--muted);text-align:center}
@media (hover:none){.keys{display:none}}
@media (max-width:460px){.row2{grid-template-columns:1fr;gap:6px}.bal b{font-size:24px}}
@media (prefers-reduced-motion:reduce){#go{transition:none}}
</style></head><body>
<div id="app">
  <header class="hud">
    <div class="row1">
      <div class="sign bal"><span class="lbl">رصيدك</span><b id="bal">0</b><span class="unit">م</span></div>

    </div>
    <div class="row2">
      <div class="track" dir="ltr">

        <span class="left" id="left">500 م</span>

      <div class="stam" id="stamwrap"><span>البنزين</span><div class="bar"><i id="stam"></i></div><em id="vehname">الدفنوس</em><span class="hearts" id="hearts" hidden aria-label="السلامة"></span></div>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <section class="sheet" id="home"></section>
    <section class="sheet" id="end" hidden></section>
    <div id="pause" hidden>موقّف. اضغط للمتابعة</div>

  <footer class="ctl">
    <button id="go" type="button">اطلع للشغل</button>
    <div class="keys" id="keys">من الكيبورد: مسطرة (Space) للمشي والوقوف، السهم الأيمن مشي، السهم الأيسر وقوف، وP للإيقاف</div>
  </footer>
</div>

  var SAVE_KEY = 'dawam.v4';
  var S = load() || fresh();
  function fresh() { return { money: 0, day: 1, up: { shoes: 0, thermos: 0, alarm: 0, bag: 0, gym: 0 }, veh: 0, owned: [0], best: 0, route: 'long' }; }
