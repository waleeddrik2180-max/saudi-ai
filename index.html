<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saudi AI</title>
    <style>
        body { background-color: #0d1117; font-family: Tahoma, sans-serif; color: #ffffff; margin: 0; }
        .container { width: 480px; height: 650px; background: #161b22; border: 2px solid #006c35; }
        
        /* الهيدر */
        .header { background: linear-gradient(135deg, #006c35, #044e27); padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 16px; margin: 0; color: #ffffff; font-weight: bold; }
        .header-btns { display: flex; gap: 8px; align-items: center; }
        .action-btn { background: #004d25; border: 1px solid #00a859; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .action-btn:hover { background: #006c35; }

        /* الشات */
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-container { display: flex; flex-direction: column; max-width: 85%; }
        .message-container.user { align-self: flex-end; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Saudi AI</h1>
            <div class="header-btns">
                <button class="action-btn">جديد</button>
            </div>
        </div>
        <div class="chat-box">
            <!-- محتوى الشات هنا -->
        </div>
    </div>
</body>
</html>
