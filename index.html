<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيار | Sayyar Coffee</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f172a;
            color: #f3f4f6;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-[#0f172a] min-h-screen pb-40">

    <!-- Welcome Modal (Popup) -->
    <div id="welcome-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-[#1e293b] border border-emerald-500/30 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">

                SAYYAR COFFEE
            </div>
            <h2 class="text-xl font-black text-white mb-2">يا هلا فيك في سيار!</h2>
            <p class="text-xs text-gray-300 mb-5">عطنا اسمك عشان نخصص لك القائمة</p>
            
            <input type="text" id="user-name-input" placeholder="اكتب اسمك هنا..." class="w-full bg-[#0f172a] border border-slate-700 rounded-2xl px-4 py-3 text-white text-center font-bold focus:outline-none focus:border-emerald-500 mb-4 text-sm">
            
            <button type="button" onclick="saveName()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3 rounded-2xl transition shadow-lg text-sm cursor-pointer">

    </div>

                SAYYAR

        </div>

            <button onclick="switchTab('specialty')" id="tab-specialty" class="category-btn whitespace-nowrap px-4 py-1.5 rounded-xl text-xs font-bold bg-emerald-600 text-white transition shadow-md">☕ قهوة مختصة</button>
