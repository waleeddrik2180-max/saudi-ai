<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- إضافة هذا السطر عشان يصير الموقع متجاوب مع الجوال -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saudi AI - جوال</title>
    <style>
        /* تنسيق عام للجوال */
        body { 
            background: radial-gradient(circle at center, #0f1c14 0%, #080d0a 100%); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #ffffff; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            overscroll-behavior: none; /* منع الارتداد عند السحب */
        }
        
        .app-wrapper { 
            display: flex; 
            width: 100%; 
            height: 100vh; /* ملء الشاشة كاملة */
            background: rgba(18, 26, 21, 0.95); 
            overflow: hidden; 
            position: relative; 
            flex-direction: row;
        }

        /* شاشة تسجيل الدخول */
        #loginOverlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #0d1611; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 9999; padding: 20px; 
            text-align: center; box-sizing: border-box;
        }
        #loginOverlay h2 { color: #00ff88; margin-bottom: 15px; font-size: 28px; }
        #loginOverlay p { color: #8fa396; font-size: 16px; margin-bottom: 30px; }
        #usernameInput { 
            width: 90%; max-width: 350px; background: rgba(26, 38, 30, 0.95); 
            border: 2px solid rgba(0, 168, 89, 0.6); color: #ffffff; padding: 15px; 
            border-radius: 12px; outline: none; font-size: 16px; margin-bottom: 20px; 
            text-align: center; box-sizing: border-box;
        }
        #loginBtn { 
            background: linear-gradient(135deg, #00b359, #006c35); color: #ffffff; 
            border: none; padding: 15px 40px; border-radius: 12px; cursor: pointer; 
            font-weight: bold; font-size: 16px;
        }

        /* القائمة الجانبية (السجل) */
        .sidebar { 
            width: 280px; background: #0a110d; 
            border-left: 1px solid rgba(0, 168, 89, 0.2); 
            display: flex; flex-direction: column; padding: 15px; 
            box-sizing: border-box; position: absolute; right: -280px; /* مخفية لليمين */
            top: 0; height: 100%; z-index: 1000; transition: right 0.3s ease-in-out;
        }
        .sidebar.open { right: 0; } /* تظهر عند إضافة الكلاس open */
        
        .new-chat-btn { 
            background: linear-gradient(135deg, #00a859, #004d25); color: white; 
            border: none; padding: 12px; border-radius: 10px; cursor: pointer; 
            font-weight: bold; font-size: 14px; margin-bottom: 15px; 
        }
        .sessions-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .session-item { 
            padding: 10px; background: rgba(22, 33, 26, 0.6); border-radius: 8px; 
            font-size: 13px; cursor: pointer; color: #b8c7be; display: flex; 
            justify-content: space-between; align-items: center;
        }
        .session-item.active { background: rgba(0, 108, 53, 0.6); color: white; font-weight: bold; }
        .session-delete { background: none; border: none; color: #ff6b6b; cursor: pointer; font-size: 14px; }

        /* الحاوية الرئيسية للدردشة */
        .container { flex: 1; height: 100%; background: transparent; display: flex; flex-direction: column; position: relative; }
        
        /* الهيدر (فوق) */
        .header { 
            background: #0d1611; padding: 10px 15px; display: flex; 
            justify-content: space-between; align-items: center; 
            border-bottom: 1px solid rgba(0, 168, 89, 0.3); 
            position: sticky; top: 0; z-index: 10;
        }
        .header h1 { font-size: 18px; margin: 0; color: #ffffff; }
        .header-btns { display: flex; gap: 8px; align-items: center; }
        .action-btn { 
            background: rgba(0, 82, 39, 0.6); border: 1px solid rgba(0, 168, 89, 0.6); 
            color: white; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; 
        }
        #mobile-menu-btn { display: block; } /* زر القائمة ظاهر في الجوال */

        /* صندوق الدردشة (الوسط) */
        .chat-box { 
            flex: 1; padding: 15px; overflow-y: auto; display: flex; 
            flex-direction: column; gap: 16px; padding-bottom: 80px; /* مساحة لمنطقة الإدخال */
        }
        
        .message-container { display: flex; flex-direction: column; max-width: 90%; }
        .message-container.user { align-self: flex-end; }
        .message-container.ai { align-self: flex-start; }
        
        .message { 
            padding: 12px 15px; border-radius: 12px; font-size: 14px; 
            line-height: 1.4; word-wrap: break-word; 
        }
        .message.user { background: #006c35; color: #ffffff; border-bottom-right-radius: 4px; }
        .message.ai { background: #1a261e; color: #e2ede8; border-bottom-left-radius: 4px; border: 1px solid #00a859; }

        .ai-image { width: 100%; max-width: 260px; border-radius: 8px; margin-top: 8px; border: 1px solid #00a859; }

        .msg-actions { display: flex; gap: 10px; margin-top: 5px; font-size: 10px; }
        .msg-actions button { background: none; border: none; color: #7a9485; cursor: pointer; padding: 0; }

        /* منطقة الإدخال (تحت) */
        .input-area { 
            padding: 10px; background: #0a110d; display: flex; gap: 8px; 
            border-top: 1px solid rgba(0, 168, 89, 0.3); 
            position: fixed; bottom: 0; left: 0; width: 100%; box-sizing: border-box; 
            z-index: 20; /* لضمان بقائها فوق الكيبورد */
        }
        #userInput { 
            flex: 1; background: #080d0a; border: 1px solid #00a859; 
            color: #ffffff; padding: 12px; border-radius: 10px; outline: none; font-size: 14px; 
            -webkit-appearance: none; /* مهم لجوالات آيفون */
        }
        #sendBtn { 
            background: linear-gradient(135deg, #00a859, #004d25); color: #ffffff; 
            border: none; padding: 0 20px; border-radius: 10px; cursor: pointer; 
            font-weight: bold; font-size: 14px;
        }
        #sendBtn:disabled { background: #1c2620; color: #4e6356; }

        /* مؤشر الكتابة */
        .typing-indicator span { height: 7px; width: 7px; background-color: #00ff88; display: inline-block; animation: bounce 1.3s infinite ease-in-out; margin: 0 2px; border-radius: 50%; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

        /* تحسينات لشاشات الآيباد الصغيرة */
        @media (min-width: 768px) {
            .app-wrapper { width: 750px; height: 650px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
            .sidebar { position: relative; right: 0; } /* القائمة الجانبية ثابتة في الشاشات الكبيرة */
            #mobile-menu-btn { display: none; } /* إخفاء زر القائمة */
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div id="loginOverlay">
        <h2>Saudi AI 🇸🇦</h2>
        <p>الرجاء إدخال اسمك للبدء في المحادثة</p>
        <input type="text" id="usernameInput" placeholder="اكتب اسمك هنا..." />
        <button id="loginBtn" onclick="handleLogin()">دخول</button>
    </div>

    <div class="sidebar" id="sidebar">
        <button class="new-chat-btn" onclick="createNewChat()">+ محادثة جديدة</button>
        <div class="sessions-list" id="sessionsList"></div>
    </div>

    <div class="container" id="appContainer">
        <div class="header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="action-btn" id="mobile-menu-btn" onclick="toggleSidebar()">☰ القائمة</button>
                <button class="action-btn" id="clearBtn" onclick="clearCurrentChat()">🗑️ مسح</button>
            </div>
            <h1 id="mainTitle">Saudi AI 🇸🇦</h1>
            <button class="action-btn" id="logoutBtn" onclick="handleLogout()" style="background: rgba(130, 34, 34, 0.5);">خروج</button>
        </div>
        
        <div id="chatBox" class="chat-box"></div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="اسأل أو ارسم مع سعودي AI..." inputmode="text" />
            <button id="sendBtn" onclick="sendMessage()">إرسال</button>
        </div>
    </div>
</div>

<script>

    const POLLINATIONS_API_KEY = "sk_QDpz3oPjrMciSh9Tt0ll0CWSNQ1hDDvE";
    
    let currentUser = localStorage.getItem('saudi_ai_user') || '';
    let sessions = JSON.parse(localStorage.getItem('saudi_ai_sessions')) || [];
    let currentSessionId = localStorage.getItem('saudi_ai_current_session') || null;

    if (sessions.length === 0) {
        createNewSession("محادثة جديدة");
    } else if (!currentSessionId || !sessions.find(s => s.id == currentSessionId)) {
        currentSessionId = sessions[0].id;
    }

    // دوال النظام الأساسية
    window.addEventListener('DOMContentLoaded', () => {
        checkLoginState();
        renderSessionsList();
        renderChatBox();
        handleWindowResize();
        window.addEventListener('resize', handleWindowResize);
    });

    function handleWindowResize() {
        const sidebar = document.getElementById('sidebar');
        if (window.innerWidth >= 768) {
            sidebar.classList.add('open');
        } else {
            sidebar.classList.remove('open');
        }
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    function checkLoginState() {
        const overlay = document.getElementById('loginOverlay');
        if (currentUser && currentUser.trim() !== "") {
            overlay.style.display = 'none';
        } else {
            overlay.style.display = 'flex';
        }
    }

    function handleLogin() {
        const nameInput = document.getElementById('usernameInput');
        const name = nameInput.value.trim();
        if (!name) {
            alert("الرجاء إدخال الاسم أولاً!");
            return;
        }
        currentUser = name;
        localStorage.setItem('saudi_ai_user', currentUser);
        document.getElementById('loginOverlay').style.display = 'none';
        const currentSession = sessions.find(s => s.id == currentSessionId);
        if (currentSession && currentSession.messages.length === 1) {
            currentSession.messages.push({ role: "assistant", content: `أهلاً بك يا ${currentUser}! منور اليوم، كيف أقدر أخدمك أو أرسم لك؟` });
            saveData();
        }
        renderChatBox();
    }

    function handleLogout() {
        localStorage.removeItem('saudi_ai_user');
        currentUser = '';
        document.getElementById('usernameInput').value = '';
        document.getElementById('loginOverlay').style.display = 'flex';
    }

    // دوال إدارة المحادثات
    function createNewSession(title) {
        const newId = Date.now();
