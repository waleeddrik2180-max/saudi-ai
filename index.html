<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saudi AI</title>
    <style>
        body { background-color: #0b1f14; color: #fff; font-family: Tahoma, sans-serif; text-align: center; padding: 50px; }
        input, button { padding: 10px; margin: 10px; border-radius: 5px; border: none; font-size: 16px; }
        input { width: 300px; }
        button { background-color: #0fa47f; color: white; cursor: pointer; }
        #chat-box { width: 500px; margin: 20px auto; background: #132e20; padding: 20px; border-radius: 10px; min-height: 200px; text-align: right; }
    </style>
</head>
<body>

    <h1>Saudi AI 🇸🇦</h1>
    <div id="login-screen">
        <p>ادخل مفتاح الـ API الخاص بك:</p>
        <input type="password" id="apiKey" placeholder="الصق المفتاح هنا (AQ... أو AIza...)">
        <br>
        <button onclick="saveKey()">دخول</button>
    </div>

    <div id="app-screen" style="display:none;">
        <button onclick="logout()" style="float: left; background: #a40f0f;">خروج</button>
        <div id="chat-box">أهلاً بك! اكتب رسالتك تحت.</div>
        <input type="text" id="userInput" placeholder="اكتب رسالتك...">
        <button onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        let apiKey = localStorage.getItem("gemini_key");
        if (apiKey) { showApp(); }

        function saveKey() {
            apiKey = document.getElementById("apiKey").value.trim();
            if (apiKey) {
                localStorage.setItem("gemini_key", apiKey);
                showApp();
            } else {
                alert("الرجاء إدخال مفتاح صحيح");
            }
        }

        function showApp() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("app-screen").style.display = "block";
        }

        function logout() {
            localStorage.removeItem("gemini_key");
            location.reload();
        }

        async function sendMessage() {
            const text = document.getElementById("userInput").value;
            if (!text) return;
            
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<p><b>أنت:</b> ${text}</p>`;
            document.getElementById("userInput").value = "";

            try {
                // استخدام أحدث نموذج Gemini 2.5 Flash عبر REST API مباشرة ليعمل في المتصفح بدون تعقيد
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content) {
                    const reply = data.candidates[0].content.parts[0].text;
                    chatBox.innerHTML += `<p><b>سعودي آي:</b> ${reply}</p>`;
                } else {
                    chatBox.innerHTML += `<p style="color:red;">عذراً، حدث خطأ في الرد أو المفتاح غير صالح.</p>`;
                }
            } catch (err) {
                chatBox.innerHTML += `<p style="color:red;">خطأ في الاتصال بالشبكة.</p>`;
            }
        }
    </script>
</body>
</html>
